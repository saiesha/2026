<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Collatz Linked Lists</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#111b30;--line:#2a3a55;--text:#edf3ff;--muted:#91a3bf;--accent:#67e8f9;--child:#b7a0ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}
header{padding:24px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}h1{margin:0;font-size:30px}h1 span{color:var(--accent)}header p{margin:5px 0;color:var(--muted)}
main{max-width:1100px;margin:auto;padding:22px 16px}.controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;padding:15px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
label{display:block;margin-bottom:5px;color:#dce7f8}input{width:150px;padding:10px;background:#091326;border:1px solid #354865;border-radius:8px;color:var(--text)}button{padding:10px 16px;border:0;border-radius:8px;background:#15566b;color:white;font-weight:700;cursor:pointer}
.note{color:var(--muted);font-size:13px;margin:14px 2px}.list{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:minmax(90px,1fr) minmax(90px,1fr) minmax(180px,2fr);gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border-bottom:0}.head{background:#17243a;color:#aebfd8;font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}.number{font-size:16px;font-weight:800;color:var(--accent)}.children{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 9px;border:1px solid #65569a;background:#211e3c;color:#e2d9ff;border-radius:7px;font-weight:700}.empty{padding:24px;color:var(--muted)}.indent{display:inline-block;color:var(--muted);font-weight:400;margin-right:5px}
@media(max-width:600px){.row{grid-template-columns:1fr 1fr;gap:6px}.row .children{grid-column:1/-1}.head{display:none}}
</style>
</head>
<body>
<header><h1>Collatz <span>Linked Lists</span></h1><p>A shared-node reverse Collatz tree, shown as plain list records — no graph or force layout.</p></header>
<main>
<section class="controls">
<div><label for="root">Root number</label><input id="root" type="number" min="1" max="1000000" value="1"></div>
<div><label for="levels">Expansion levels</label><input id="levels" type="number" min="1" max="12" value="6"></div>
<button id="build">Build lists</button>
</section>
<p class="note">Each node has one parent and at most two children: 2n, and (n−1)/3 when that is a positive integer. A number is listed only once, even when multiple paths reach it.</p>
<div class="list" id="list"><div class="empty">Building list…</div></div>
</main>
<script>
const el=id=>document.getElementById(id);
function childrenOf(n){
 const out=[2*n];
 const inverse=(n-1)/3;
 if(Number.isInteger(inverse)&&inverse>0)out.push(inverse);
 return out;
}
function build(){
 const root=Math.max(1,Math.floor(Number(el('root').value)||1));
 const levels=Math.min(12,Math.max(1,Math.floor(Number(el('levels').value)||1)));
 const records=[{n:root,parent:null,depth:0}],byNumber=new Map([[root,records[0]]]);
 for(let i=0;i<records.length;i++){
  const node=records[i];if(node.depth>=levels)continue;
  node.children=[];
  for(const child of childrenOf(node.n)){
   if(byNumber.has(child))continue;
   const rec={n:child,parent:node.n,depth:node.depth+1};
   byNumber.set(child,rec);records.push(rec);node.children.push(child);
  }
 }
 const sorted=records;
 let out='<div class="row head"><div>Number</div><div>Parent</div><div>Children (max 2)</div></div>';
 for(const r of sorted){
  const indent='— '.repeat(r.depth);
  const kids=r.children||[];
  out+='<div class="row"><div class="number"><span class="indent">'+indent+'</span>'+r.n+'</div><div>'+(r.parent===null?'—':r.parent)+'</div><div class="children">'+(kids.length?kids.map(n=>'<span class="pill">'+n+'</span>').join(''):'<span style="color:var(--muted)">Not expanded</span>')+'</div></div>';
 }
 el('list').innerHTML=out;
}
el('build').addEventListener('click',build);build();
</script>
</body></html>
